name: Kiểm thử ứng dụng web

# Chạy mỗi lần đẩy mã: mở ứng dụng bằng trình duyệt thật rồi bấm, gõ, kéo đúng
# như người dùng. Có gì vỡ là biết ngay, không phải đợi tới lúc phát hành.
#
# Chỉ bắt theo "push". Pull request mở từ chính kho này đã được lần đẩy mã
# tương ứng bao trọn rồi, thêm "pull_request" nữa là chạy đúp, tốn công vô ích.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Kiểu dữ liệu của cả mã nguồn lẫn bộ kiểm thử.
      - name: Kiểm tra kiểu dữ liệu
        run: |
          npx tsc -b
          npx tsc -p tsconfig.test.json

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      # Bản thu thật không nằm trong kho mã, nên bước này tự tạo tệp nhạc câm
      # đúng độ dài từng bài (xem tests/make-silent-audio.mjs).
      - name: Chạy kiểm thử
        run: npm test

      - name: Giữ lại báo cáo khi có bài hỏng
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
