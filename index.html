<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Biểu tượng PNG để Android (bảng chia sẻ, thanh tab) hiện đúng logo
         Chansonia; một số trình duyệt bỏ qua favicon SVG. -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="./icons/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e7" />
    <!-- Cài lên màn hình chính như một ứng dụng. Đường dẫn dùng dạng tương đối để
         chạy được cả khi đặt trong thư mục con (GitHub Pages) lẫn từ đĩa. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chansonia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Chansonia: songs, synced lyrics and music videos by Je m'appelle Hương, BizOnland, M-AIDA and two history games."
    />
    <!-- Mã DOI (Zenodo) để trích dẫn ứng dụng: thư viện, Google Scholar và
         Zotero đọc thẻ citation_doi này. -->
    <meta name="citation_title" content="Chansonia" />
    <meta name="citation_author" content="Đỗ, Thùy Hương" />
    <meta name="citation_publication_date" content="2026" />
    <meta name="citation_doi" content="10.5281/zenodo.22172794" />
    <link rel="cite-as" href="https://doi.org/10.5281/zenodo.22172794" />
    <!-- Ảnh và chữ hiện khi gửi link (Zalo, Facebook, Messenger…). Đường dẫn
         đầy đủ vì các trang này không hiểu đường dẫn tương đối. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chansonia" />
    <meta property="og:title" content="Chansonia" />
    <meta property="og:description" content="Songs, synced lyrics and music videos by Je m'appelle Hương." />
    <meta property="og:url" content="https://chansonia.jemappellehuong.com/app/" />
    <meta property="og:image" content="https://chansonia.jemappellehuong.com/app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chansonia logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://chansonia.jemappellehuong.com/app/og-image.png" />
    <!-- Chữ dùng ngay bộ có sẵn của máy (serif kiểu Iowan Old Style/Georgia cho
         tiêu đề, sans hệ thống cho phần còn lại) — cùng một lựa chọn với trang
         songbook trên web, và không cần tải font qua mạng. -->
    <title>Chansonia</title>
  </head>
  <body>
    <script>
      // Đặt chủ đề sáng/tối trước khi vẽ trang để không bị nháy màu.
      try {
        var t = localStorage.getItem("chansonia-theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
